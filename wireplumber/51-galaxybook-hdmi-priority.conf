# Galaxy Book4 Pro : préférer la sortie HDMI/DP (TV/moniteur externe)
# aux hauts-parleurs internes dès qu'elle est disponible.
# Sans cela, le Speaker (priority 1000) garde le défaut face aux HDMI (696).
monitor.alsa.rules = [
  {
    matches = [
      { "node.name" = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__HDMI*__sink" }
    ]
    apply_properties = {
      "priority.session" = 2000
    }
  }
]
